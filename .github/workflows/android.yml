name: Android CI
on:
 push:
  branches: [main, "feat/**"]
 pull_request:
  branches: [main]
 workflow_dispatch:
concurrency:
 group: arabify-android-${{ github.ref }}
 cancel-in-progress: true
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.13"
   - name: Unit tests
     run: gradle testDebugUnitTest
   - name: Upload unit test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-unit-test-results
      path: app/build/test-results/testDebugUnitTest/
      if-no-files-found: ignore
      retention-days: 7
   - name: Build debug APK
     run: gradle assembleDebug
   - name: Verify APK structure and signature
     shell: bash
     run: |
      set -euo pipefail
      APK="app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      unzip -t "$APK"
      APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
      AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
      test -x "$APKSIGNER"
      test -x "$AAPT"
      "$APKSIGNER" verify --verbose "$APK"
      "$AAPT" dump badging "$APK" > badging.txt
      head -n 5 badging.txt
      sha256sum "$APK"
   - uses: actions/upload-artifact@v4
     with:
      name: arabify-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
