name: Android CI
on:
 push:
  branches: [main, "feat/**"]
 pull_request:
  branches: [main]
 workflow_dispatch:
concurrency:
 group: arabify-android-${{ github.ref }}
 cancel-in-progress: true
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.13"
   - name: Unit tests
     run: gradle testDebugUnitTest
   - name: Upload unit test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-unit-test-results
      path: app/build/test-results/testDebugUnitTest/
      if-no-files-found: ignore
      retention-days: 7
   - name: Build debug APK
     run: gradle assembleDebug
   - name: Verify APK structure and signature
     shell: bash
     run: |
      set -euo pipefail
      APK="app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      unzip -t "$APK"
      APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
      AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
      test -x "$APKSIGNER"
      test -x "$AAPT"
      "$APKSIGNER" verify --verbose "$APK"
      "$AAPT" dump badging "$APK" > badging.txt
      head -n 5 badging.txt
      sha256sum "$APK"
   - name: Build instrumentation test APK
     run: gradle assembleDebugAndroidTest
   - name: Checkout pinned open-source Android game source
     uses: actions/checkout@v4
     with:
      repository: JoelDankert/Minesweeper-for-Android
      ref: 115ee86a0d5d998c6c882de63953aef54100a1fd
      path: build/test-game/source
   - name: Prepare Minesweeper localization fixture
     run: bash .github/scripts/prepare-minesweeper-fixture.sh
   - name: Build real game APK from GitHub source
     run: |
      set -euo pipefail
      cd build/test-game/source
      bash ./gradlew :app:assembleDebug --no-daemon
      cp app/build/outputs/apk/debug/app-debug.apk ../minesweeper.apk
      test -s ../minesweeper.apk
      cd ../../..
      sha256sum build/test-game/minesweeper.apk | tee build/test-game/SHA256SUMS
   - name: Cache Maestro CLI
     id: maestro-cache
     uses: actions/cache@v4
     with:
      path: ~/.maestro-cli
      key: maestro-cli-2.12.1-linux-x64
   - name: Install pinned Maestro CLI
     if: steps.maestro-cache.outputs.cache-hit != 'true'
     run: |
      set -euo pipefail
      mkdir -p "$HOME/.maestro-cli"
      BASE_URL="https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1"
      curl --fail --location --retry 3 "$BASE_URL/maestro.zip" --output "$RUNNER_TEMP/maestro.zip"
      curl --fail --location --retry 3 "$BASE_URL/checksums_sha256.txt" --output "$RUNNER_TEMP/maestro-checksums.txt"
      MAESTRO_SHA="$(awk '$2 == "maestro.zip" { print $1; exit }' "$RUNNER_TEMP/maestro-checksums.txt")"
      test "${#MAESTRO_SHA}" -eq 64
      printf '%s  %s\n' "$MAESTRO_SHA" "$RUNNER_TEMP/maestro.zip" | sha256sum --check -
      unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
      MAESTRO_BIN="$(find "$HOME/.maestro-cli" -type f -name maestro -perm -111 -print -quit)"
      test -n "$MAESTRO_BIN"
   - name: Add Maestro CLI to PATH
     run: |
      MAESTRO_BIN="$(find "$HOME/.maestro-cli" -type f -name maestro -perm -111 -print -quit)"
      test -n "$MAESTRO_BIN"
      echo "$(dirname "$MAESTRO_BIN")" >> "$GITHUB_PATH"
      "$MAESTRO_BIN" --version
   - name: Enable KVM access
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - name: Run real-game localization on Android emulator
     uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_5
      disable-linux-hw-accel: false
      pre-emulator-launch-script: |
       adb kill-server || true
       adb start-server
       adb devices
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
      disable-animations: true
      script: |
       bash .github/scripts/run-real-game-localization.sh
   - name: Upload real-game localization test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-real-game-localization-test
      path: |
       app/build/outputs/androidTest-results/connected/
       app/build/reports/androidTests/connected/
       build/test-game/SHA256SUMS
       build/test-game/localized/
       build/maestro/
      if-no-files-found: ignore
      retention-days: 14
   - name: Upload final debug APK
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
