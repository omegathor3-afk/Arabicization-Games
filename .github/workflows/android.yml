name: Android CI
on:
 push:
  branches: [main, "feat/**"]
 pull_request:
  branches: [main]
 workflow_dispatch:
concurrency:
 group: arabify-android-${{ github.ref }}
 cancel-in-progress: false
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.13"
   - name: Unit tests
     run: gradle testDebugUnitTest
   - name: Upload unit test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-unit-test-results
      path: app/build/test-results/testDebugUnitTest/
      if-no-files-found: ignore
      retention-days: 7
   - name: Build debug APK
     run: gradle assembleDebug
   - name: Verify APK structure and signature
     shell: bash
     run: |
      set -euo pipefail
      APK="app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      unzip -t "$APK"
      APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
      AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
      test -x "$APKSIGNER"
      test -x "$AAPT"
      "$APKSIGNER" verify --verbose "$APK"
      "$AAPT" dump badging "$APK" > badging.txt
      head -n 5 badging.txt
      sha256sum "$APK"
   - name: Build instrumentation test APK
     run: gradle assembleDebugAndroidTest
   - name: Checkout pinned open-source Android game source
     uses: actions/checkout@v4
     with:
      repository: JoelDankert/Minesweeper-for-Android
      ref: 115ee86a0d5d998c6c882de63953aef54100a1fd
      path: build/test-game/source
   - name: Build real game APK from GitHub source
     run: |
      set -euo pipefail
      cd build/test-game/source
      bash ./gradlew :app:assembleDebug --no-daemon
      cp app/build/outputs/apk/debug/app-debug.apk ../minesweeper.apk
      test -s ../minesweeper.apk
      cd ../../..
      sha256sum build/test-game/minesweeper.apk | tee build/test-game/SHA256SUMS
   - name: Run real-game localization on Android emulator
     uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_5
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
      disable-animations: true
      script: |
       bash .github/scripts/run-real-game-localization.sh
   - name: Upload real-game localization test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-real-game-localization-test
      path: |
       app/build/outputs/androidTest-results/connected/
       app/build/reports/androidTests/connected/
       build/test-game/SHA256SUMS
       build/test-game/localized/
      if-no-files-found: ignore
      retention-days: 14
   - uses: actions/upload-artifact@v4
     with:
      name: arabify-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
