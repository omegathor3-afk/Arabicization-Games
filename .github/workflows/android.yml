name: Android CI
on:
 push:
  branches: [main, "feat/**"]
 pull_request:
  branches: [main]
 workflow_dispatch:
concurrency:
 group: arabify-android-${{ github.ref }}
 cancel-in-progress: false
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.13"
   - name: Unit tests
     run: gradle testDebugUnitTest
   - name: Upload unit test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-unit-test-results
      path: app/build/test-results/testDebugUnitTest/
      if-no-files-found: ignore
      retention-days: 7
   - name: Build debug APK
     run: gradle assembleDebug
   - name: Verify APK structure and signature
     shell: bash
     run: |
      set -euo pipefail
      APK="app/build/outputs/apk/debug/app-debug.apk"
      test -s "$APK"
      unzip -t "$APK"
      APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
      AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
      test -x "$APKSIGNER"
      test -x "$AAPT"
      "$APKSIGNER" verify --verbose "$APK"
      "$AAPT" dump badging "$APK" > badging.txt
      head -n 5 badging.txt
      sha256sum "$APK"
   - name: Build instrumentation test APK
     run: gradle assembleDebugAndroidTest
   - name: Download open-source Android game test fixture
     run: |
      mkdir -p build/test-game
      curl --fail --location --retry 3 \
        https://f-droid.org/repo/com.joeld.minesweeper_7.apk \
        --output build/test-game/minesweeper.apk
      test -s build/test-game/minesweeper.apk
      sha256sum build/test-game/minesweeper.apk | tee build/test-game/SHA256SUMS
   - name: Run real-game localization on Android emulator
     uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_5
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
      disable-animations: true
      script: |
       set -euo pipefail
       adb install build/test-game/minesweeper.apk
       gradle connectedDebugAndroidTest \
         -Pandroid.testInstrumentationRunnerArguments.class=com.omega.arabify.RealGameLocalizationInstrumentedTest \
         --stacktrace
   - name: Upload real-game localization test reports
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: arabify-real-game-localization-test
      path: |
       app/build/outputs/androidTest-results/connected/
       app/build/reports/androidTests/connected/
       build/test-game/SHA256SUMS
      if-no-files-found: ignore
      retention-days: 14
   - uses: actions/upload-artifact@v4
     with:
      name: arabify-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
