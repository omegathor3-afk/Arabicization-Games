name: Mindustry locale slot CI
on:
 push:
  branches: [main, "feat/**"]
 workflow_dispatch:
concurrency:
 group: arabify-mindustry-${{ github.ref }}
 cancel-in-progress: true
permissions:
 contents: read
jobs:
 mindustry-slot:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
   - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
     with:
      gradle-version: "8.13"
   - name: Download pinned Mindustry APK from F-Droid
     run: |
      set -euo pipefail
      mkdir -p build/test-game
      curl --fail --location --retry 3 --retry-all-errors "https://f-droid.org/repo/io.anuke.mindustry_1115.apk" --output build/test-game/mindustry.apk
      printf '%s  %s\n' '64bf33842d8f5495656c44868ea3d11ca5998bf6e36bbb428064dcc58c2e9f44' build/test-game/mindustry.apk | sha256sum --check -
   - name: Build app and instrumentation test APKs
     run: gradle assembleDebug assembleDebugAndroidTest
   - name: Enable KVM access
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - name: Run Mindustry locale slot test on Android emulator
     uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_5
      disable-linux-hw-accel: false
      pre-emulator-launch-script: |
       adb kill-server || true
       adb start-server
       adb devices
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
      disable-animations: true
      script: |
       bash .github/scripts/run-mindustry-slot.sh
       slot_status=$?
       bash .github/scripts/run-mindustry-real-translation.sh
       real_status=$?
       if [ "$slot_status" -ne 0 ]; then exit "$slot_status"; fi
       exit "$real_status"
   - name: Upload Mindustry locale slot test reports
     if: always()
     uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with:
      name: arabify-mindustry-slot-test
      path: |
       app/build/outputs/androidTest-results/connected/
       app/build/reports/androidTests/connected/
       build/test-game/localized/
      if-no-files-found: ignore
      retention-days: 14
