name: Bergamot Android native CI

on:
  push:
    branches: ["feat/unity-mono-streamingassets"]
    paths:
      - "native/bergamot/**"
      - "app/src/main/java/com/omega/arabify/BergamotNative.kt"
      - ".github/workflows/bergamot-native.yml"
  workflow_dispatch:

concurrency:
  group: arabify-bergamot-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK and CMake
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Ninja
        run: |
          NINJA="$(find "$ANDROID_HOME/cmake" -type f -name ninja -perm -111 -print -quit)"
          if [[ -z "$NINJA" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; else echo "$(dirname "$NINJA")" >> "$GITHUB_PATH"; fi
          ninja --version
      - name: Build pinned Bergamot JNI library
        run: native/bergamot/build-android.sh
      - name: Verify native library ABI and dependencies
        run: |
          file app/src/main/jniLibs/arm64-v8a/*.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libarabify_bergamot.so
          readelf -d app/src/main/jniLibs/arm64-v8a/libarabify_bergamot.so
          sha256sum app/src/main/jniLibs/arm64-v8a/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: arabify-bergamot-arm64-jni
          path: app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14
