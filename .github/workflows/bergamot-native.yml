name: Bergamot Android native CI

on:
  push:
    branches: ["feat/unity-mono-streamingassets"]
    paths:
      - "native/bergamot/**"
      - "app/src/main/java/com/omega/arabify/BergamotNative.kt"
      - "app/src/androidTest/**"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - ".github/workflows/bergamot-native.yml"
  workflow_dispatch:

concurrency:
  group: arabify-bergamot-native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android NDK and CMake
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Ninja
        run: |
          NINJA="$(find "$ANDROID_HOME/cmake" -type f -name ninja -perm -111 -print -quit)"
          if [[ -z "$NINJA" ]]; then sudo apt-get update && sudo apt-get install -y ninja-build; else echo "$(dirname "$NINJA")" >> "$GITHUB_PATH"; fi
          ninja --version
      - name: Build pinned Bergamot JNI library
        run: native/bergamot/build-android.sh
      - name: Build x86_64 JNI for API 35 emulator runtime test
        run: ANDROID_ABI=x86_64 native/bergamot/build-android.sh
      - name: Verify native library ABIs and dependencies
        run: |
          for abi in arm64-v8a x86_64; do
            file "app/src/main/jniLibs/$abi/"*.so
            readelf -h "app/src/main/jniLibs/$abi/libarabify_bergamot.so"
            readelf -d "app/src/main/jniLibs/$abi/libarabify_bergamot.so"
            sha256sum "app/src/main/jniLibs/$abi/"*.so
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arabify-bergamot-arm64-jni
          path: app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: arabify-bergamot-x86_64-jni
          path: app/src/main/jniLibs/x86_64/*.so
          if-no-files-found: error
          retention-days: 14

  model-package-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify Mozilla Arabic base-memory Release packages
        run: python3 native/bergamot/audit-mozilla-arabic-models.py
      - uses: actions/upload-artifact@v4
        with:
          name: arabify-mozilla-arabic-model-lock
          path: |
            build/arabic-model-lock.json
            build/moz-models/
          if-no-files-found: error
          retention-days: 30

  instrumented-offline:
    needs: [build-arm64, model-package-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: arabify-bergamot-arm64-jni
          path: app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: arabify-mozilla-arabic-model-lock
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: arabify-bergamot-x86_64-jni
          path: app/src/main/jniLibs/x86_64
      - name: Stage verified offline model assets
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libarabify_bergamot.so
          test -s build/moz-models/ar-en/config.yml
          test -s build/moz-models/en-ar/config.yml
          mkdir -p app/src/androidTest/assets
          cp -a build/moz-models app/src/androidTest/assets/bergamot
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run offline Bergamot instrumentation on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell settings put global airplane_mode_on 1
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell cmd connectivity airplane-mode enable || true
            adb shell dumpsys connectivity
            set +e
            ./gradlew connectedDebugAndroidTest --stacktrace
            test_status=$?
            mkdir -p build/bergamot-instrumented
            adb logcat -d -v threadtime -s BergamotOfflineTest:I > build/bergamot-instrumented/instrumentation.log
            adb shell settings get global airplane_mode_on > build/bergamot-instrumented/airplane-mode.txt || true
            adb shell dumpsys connectivity > build/bergamot-instrumented/connectivity.txt || true
            adb shell dumpsys wifi > build/bergamot-instrumented/wifi.txt || true
            printf '%s\n' "$test_status" > build/bergamot-instrumented/test-exit-code.txt
            exit "$test_status"
      - name: Upload offline translation metrics and emulator state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabify-bergamot-offline-metrics
          path: build/bergamot-instrumented/
          if-no-files-found: warn
          retention-days: 30
