name: Firebase Test Lab - real game localization

on:
  push:
    branches: ["feat/unity-mono-streamingassets"]
    paths:
      - "app/**"
      - ".github/workflows/firebase-test-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabify-firebase-test-lab
  cancel-in-progress: false

jobs:
  build-game-fixture:
    if: ${{ vars.FIREBASE_TEST_LAB_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JoelDankert/Minesweeper-for-Android
          ref: 115ee86a0d5d998c6c882de63953aef54100a1fd
          path: game-source
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build pinned GitHub game source without Firebase credentials
        run: |
          set -euo pipefail
          cd game-source
          bash ./gradlew :app:assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p ../game-artifact
          cp "$APK" ../game-artifact/minesweeper.apk
          cd ..
          sha256sum game-artifact/minesweeper.apk | tee game-artifact/SHA256SUMS

      - name: Upload pinned game APK
        uses: actions/upload-artifact@v4
        with:
          name: arabify-minesweeper-game-fixture
          path: game-artifact/
          if-no-files-found: error
          retention-days: 14

  real-game-localization:
    if: ${{ vars.FIREBASE_TEST_LAB_ENABLED == 'true' }}
    needs: build-game-fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unity-mono-streamingassets

      - uses: actions/download-artifact@v4
        with:
          name: arabify-minesweeper-game-fixture
          path: build/test-game

      - name: Check Firebase Test Lab connection settings
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in FIREBASE_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "Firebase project and keyless GitHub OIDC authentication settings are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build ARABIFY app and instrumentation APKs
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify Firebase Test Lab API and virtual-device catalog
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud config set project "$FIREBASE_PROJECT_ID"
          gcloud services list --enabled --filter="config.name:testing.googleapis.com" --format="value(config.name)" | grep -q testing.googleapis.com
          gcloud firebase test android models list --filter=virtual

      - name: Translate and launch the real GitHub game on Firebase Test Lab
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --additional-apks build/test-game/minesweeper.apk \
            --device model=MediumPhone.arm,version=35,locale=ar,orientation=portrait \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --test-targets "class com.omega.arabify.RealGameLocalizationInstrumentedTest" \
            --directories-to-pull /sdcard/Android/data/com.omega.arabify/files/real-game-test \
            --timeout 30m \
            --use-orchestrator \
            --record-video \
            --performance-metrics \
            --client-details matrixLabel=ARABIFY-real-game-localization,gitBranch=feat/unity-mono-streamingassets,game=JoelDankert-Minesweeper,sourceSha=115ee86a0d5d998c6c882de63953aef54100a1fd

      - name: Upload test APKs and input identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabify-firebase-test-inputs
          path: |
            build/test-game/minesweeper.apk
            build/test-game/SHA256SUMS
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 14
