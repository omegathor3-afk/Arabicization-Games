name: Arabify app UI screenshot CI
on:
 push:
  branches: [main, "feat/**"]
  paths:
   - "app/src/main/java/com/omega/arabify/MainActivity.kt"
   - "app/src/main/java/com/omega/arabify/ArabifyDesignSystem.kt"
   - "app/src/main/res/**"
   - ".github/scripts/run-arabify-ui-screenshot.sh"
   - ".github/workflows/arabify-ui.yml"
 workflow_dispatch:
concurrency:
 group: arabify-ui-${{ github.ref }}
 cancel-in-progress: true
permissions:
 contents: read
jobs:
 arabify-ui:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  steps:
   - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
   - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
     with:
      distribution: temurin
      java-version: "17"
   - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
     with:
      gradle-version: "8.13"
   - name: Build app APK
     run: gradle assembleDebug
   - name: Enable KVM access
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - name: Screenshot the Arabify app on Android emulator
     uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_5
      disable-linux-hw-accel: false
      pre-emulator-launch-script: |
       adb kill-server || true
       adb start-server
       adb devices
      emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
      disable-animations: false
      script: |
       bash .github/scripts/run-arabify-ui-screenshot.sh
   - name: Upload UI screenshot reports
     if: always()
     uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
     with:
      name: arabify-ui-screenshots
      path: build/arabify-ui/
      if-no-files-found: ignore
      retention-days: 14
